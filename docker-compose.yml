# Ambiente completo local:  docker compose up --build   →  http://localhost:5051
# Só o banco (para rodar com `dotnet run`):  docker compose up -d db
# (uso local/homologação; em produção use render.yaml ou equivalente com segredos reais)
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: inovabens, POSTGRES_PASSWORD: inovabens, POSTGRES_DB: inovabens }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U inovabens"], interval: 5s, timeout: 3s, retries: 10 }
  app:
    build: { context: ./dotnet }
    depends_on: { db: { condition: service_healthy } }
    environment:
      # Development: cookie sem exigir HTTPS e senha padrão do administrador aceita (só para uso local)
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_URL: postgres://inovabens:inovabens@db:5432/inovabens
      TOKEN_ENC_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      JWT_REFRESH_SECRET: local-refresh-secret-troque-em-producao-9876543210
      WEB_URL: http://localhost:5051
      # fotos/documentos no Google Drive (vazio = envio desligado). Veja o README.
      GOOGLE_DRIVE_ID: ${GOOGLE_DRIVE_ID:-}
      GOOGLE_DRIVE_CREDENCIAIS_JSON: ${GOOGLE_DRIVE_CREDENCIAIS_JSON:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: http://localhost:5051/api/v1/integracoes/google/callback
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # com a chave, as fotos enviadas são melhoradas automaticamente pelo Magnific (consome créditos)
      MAGNIFIC_API_KEY: ${MAGNIFIC_API_KEY:-}
      # cópia pública (Cloudflare R2) das fotos marcadas como públicas, para o site
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-inovabens-site}
      R2_URL_PUBLICA: ${R2_URL_PUBLICA:-}
    ports: ["5051:8080"]
volumes: { pgdata: {} }
