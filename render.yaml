# Blueprint do Render (https://render.com/docs/blueprint-spec). New → Blueprint → aponte para este repositório.
# Um único serviço (.NET / Blazor Server) + PostgreSQL. Preencha as variáveis sync:false antes do primeiro deploy.
#
# Migrando da antiga versão Node (serviços inovabens-api + inovabens-web): este serviço mantém o nome inovabens-web
# (mesmo endereço público, então a configuração do Google não muda). COPIE do inovabens-api os valores de
# TOKEN_ENC_KEY e JWT_REFRESH_SECRET: a primeira decifra os tokens do Google e os segredos de 2FA já gravados.
# Depois apague o serviço inovabens-api no painel do Render (o blueprint não remove serviços sozinho).
databases:
  - name: inovabens-db
    plan: basic-256mb
    postgresMajorVersion: "16"
services:
  - type: web
    name: inovabens-web
    runtime: docker
    dockerfilePath: ./dotnet/Dockerfile
    dockerContext: ./dotnet
    healthCheckPath: /api/v1/health
    numInstances: 1            # os jobs agendados rodam no próprio serviço; para escalar, DISABLE_JOBS=true nas réplicas extras
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: inovabens-db, property: connectionString } }
      - { key: TOKEN_ENC_KEY, sync: false }        # 64 hex: openssl rand -hex 32 (ou o valor do inovabens-api)
      - { key: JWT_REFRESH_SECRET, sync: false }   # 32+ caracteres, diferente da TOKEN_ENC_KEY (ou o valor do inovabens-api)
      - { key: WEB_URL, sync: false }              # https://inovabens-web.onrender.com (ou seu domínio)
      - { key: SEED_ADMIN_EMAIL, sync: false }
      - { key: SEED_ADMIN_PASSWORD, sync: false }  # senha forte (em produção a senha padrão é recusada)
      - { key: GOOGLE_DRIVE_ID, sync: false }                # drive compartilhado das fotos/documentos
      - { key: GOOGLE_DRIVE_CREDENCIAIS_JSON, sync: false }  # conteúdo da chave JSON da conta de serviço
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: GOOGLE_REDIRECT_URI, sync: false }  # https://inovabens-web.onrender.com/api/v1/integracoes/google/callback
      - { key: GOOGLE_MAPS_API_KEY, sync: false }  # opcional: Geocoding API (sem ela, OpenStreetMap)
      - { key: MAGNIFIC_API_KEY, sync: false }     # opcional: melhoria automática das fotos (consome créditos)
      - { key: GOOGLE_WEBHOOK_URL, sync: false }   # https://inovabens-web.onrender.com/api/v1/webhooks/google/calendar
