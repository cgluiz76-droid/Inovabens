# Usado por infra/gcp/deploy-gcp.sh:  gcloud builds submit --config infra/gcp/cloudbuild.yaml --substitutions=_REPO=...
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, apps/api/Dockerfile, -t, "${_REPO}/api:${_TAG}", .]
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, apps/web/Dockerfile, -t, "${_REPO}/web:${_TAG}", .]
images:
  - "${_REPO}/api:${_TAG}"
  - "${_REPO}/web:${_TAG}"
options: { machineType: E2_HIGHCPU_8, logging: CLOUD_LOGGING_ONLY }
timeout: 1800s
