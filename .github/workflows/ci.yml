name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      # integração e ponta a ponta sobem um PostgreSQL descartável no Docker do runner (Testcontainers);
      # os de ponta a ponta baixam o Chromium do Playwright (com as bibliotecas do sistema, pois CI=true)
      - run: dotnet test dotnet/Inovabens.slnx
      # falha se algum pacote (direto ou transitivo) tiver vulnerabilidade conhecida
      - run: |
          dotnet list dotnet/Inovabens.slnx package --vulnerable --include-transitive | tee vulneraveis.txt
          ! grep -q "has the following vulnerable packages" vulneraveis.txt
      - run: docker build -t inovabens dotnet
      # sem o script do Blazor as telas carregam, mas nenhum botão funciona
      - run: docker run --rm --entrypoint test inovabens -f /app/wwwroot/_framework/blazor.web.js
