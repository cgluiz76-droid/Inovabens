name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inovabens/shared build
      - run: pnpm typecheck
      - run: pnpm --filter @inovabens/api test
      - run: pnpm build
  docker:
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t inovabens-api .
      - run: docker build -f apps/web/Dockerfile -t inovabens-web .
