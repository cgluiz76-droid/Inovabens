name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inovabens/shared build
      - run: pnpm typecheck
      - run: pnpm --filter @inovabens/api test
      - run: pnpm build
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      # integração e ponta a ponta sobem um PostgreSQL descartável no Docker do runner (Testcontainers);
      # os de ponta a ponta baixam o Chromium do Playwright (com as bibliotecas do sistema, pois CI=true)
      - run: dotnet test dotnet/Inovabens.slnx
      - run: docker build -t inovabens-dotnet dotnet
  docker:
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t inovabens-api .
      - run: docker build -f apps/web/Dockerfile -t inovabens-web .
